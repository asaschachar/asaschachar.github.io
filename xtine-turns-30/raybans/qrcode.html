<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR — Ray-Bans</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #efe9e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 28px 28px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 320px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #2a2a2a;
  }
  img {
    width: 220px;
    height: 220px;
    image-rendering: pixelated;
  }
  .url {
    margin-top: 14px;
    font-size: 11px;
    color: #888;
    word-break: break-all;
  }
  @media print {
    body { background: #fff; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Ray-Bans</h1>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://asaschachar.github.io/xtine-turns-30/raybans/" alt="QR code linking to Ray-Bans">
    <div class="url">https://asaschachar.github.io/xtine-turns-30/raybans/</div>
  </div>
</body>
</html>
