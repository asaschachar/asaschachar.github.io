<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Xtine Turns 30 — Example Stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #efe9e0;
    background-image: radial-gradient(circle at 20% 10%, #f5f1ea 0%, #e7e0d3 60%, #ded5c4 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 56px;
  }
  .wrap {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .stage {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 5 / 6.2;
    perspective: 1800px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.7s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 4px;
    box-shadow: 0 20px 44px -14px rgba(0,0,0,0.4), 0 3px 8px rgba(0,0,0,0.18);
  }
  /* FRONT — polaroid */
  .front {
    background: #fdfcf9;
    padding: 7% 7% 0;
    display: flex;
    flex-direction: column;
    transform: rotateZ(-1.2deg);
  }
  .front .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: repeating-linear-gradient(45deg, #ded8ca, #ded8ca 10px, #d3ccbc 10px, #d3ccbc 20px);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .front .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .front .photo .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: #8a8271;
    font-size: 12px;
    text-align: center;
    padding: 20px;
  }
  .front .photo .placeholder svg { width: 34px; height: 34px; opacity: 0.6; }
  .front .caption-strip {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .front .caption {
    font-family: 'Caveat', cursive;
    font-size: clamp(22px, 7vw, 30px);
    color: #4a4335;
    text-align: center;
  }
  /* BACK — sharpie note */
  .back {
    background: #fdfcf6;
    background-image: linear-gradient(#e9e4d6 1px, transparent 1px);
    background-size: 100% 34px;
    transform: rotateY(180deg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12% 10%;
  }
  .back .msg {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(24px, 7.5vw, 32px);
    line-height: 1.5;
    color: #1f2440;
    text-align: center;
    transform: rotate(-1deg);
  }
  button.flip-btn {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #3d3a34;
    border: none;
    border-radius: 999px;
    padding: 13px 30px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.flip-btn:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="photo">
            <div class="placeholder" id="placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/><path d="M8 5l1.5-2h5L16 5"/></svg>
              <span>Drop <code>photo.jpg</code> in this folder<br>to replace this placeholder</span>
            </div>
            <img src="photo.jpg" alt="Example Stop" onerror="this.remove()">
          </div>
          <div class="caption-strip">
            <div class="caption">Example Stop</div>
          </div>
        </div>
        <div class="face back">
          <div class="msg">MAMA COME!<br>Your first mission<br>is waiting downstairs.</div>
        </div>
      </div>
    </div>
    <button class="flip-btn" id="flipBtn">Flip it over</button>
  </div>
  <script>
    const card = document.getElementById('card');
    const btn = document.getElementById('flipBtn');
    function toggle() {
      const flipped = card.classList.toggle('flipped');
      btn.textContent = flipped ? 'Flip it back' : 'Flip it over';
    }
    card.addEventListener('click', toggle);
    btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
  </script>
</body>
</html>
