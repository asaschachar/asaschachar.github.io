<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xtine Turns 30 — Hunt Control</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #efe9e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #2a2a2a;
    padding: 32px 16px 64px;
  }
  h1 {
    text-align: center;
    margin: 0 0 6px;
    font-size: 26px;
  }
  p.sub {
    text-align: center;
    color: #7c7461;
    margin: 0 0 32px;
    font-size: 14px;
  }
  h2.section {
    max-width: 900px;
    margin: 48px auto 16px;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7c7461;
  }
  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .stop {
    background: #fdfcf9;
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    text-align: center;
  }
  .stop h3 {
    margin: 0 0 12px;
    text-transform: capitalize;
    font-size: 16px;
  }
  .stop a {
    display: block;
    font-size: 13px;
    padding: 8px 0;
    color: #1f2440;
    text-decoration: none;
    border: 1px solid #ddd6c7;
    border-radius: 6px;
    margin-top: 8px;
    background: #fff;
  }
  .stop a:hover { background: #f2eee3; }
  .print-btn-wrap {
    text-align: center;
    margin: 32px 0 8px;
  }
  .print-btn {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #3d3a34;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .qr-sheet {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .qr-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    break-inside: avoid;
  }
  .qr-card h4 {
    margin: 0 0 10px;
    text-transform: capitalize;
    font-size: 14px;
  }
  .qr-card img {
    width: 160px;
    height: 160px;
    image-rendering: pixelated;
  }
  @media print {
    body { background: #fff; padding: 0; }
    h1, p.sub, h2.section, .grid, .print-btn-wrap { display: none; }
    .qr-sheet { max-width: none; }
    .qr-card { box-shadow: none; }
  }
</style>
</head>
<body>
  <h1>Xtine Turns 30 🎉</h1>
  <p class="sub">Hunt control — flip through every stop, or print all the QR codes at once.</p>

  <h2 class="section">Stops</h2>
  <div class="grid" id="grid"></div>

  <div class="print-btn-wrap">
    <button class="print-btn" onclick="window.print()">Print all QR codes</button>
  </div>

  <h2 class="section">Printable QR sheet</h2>
  <div class="qr-sheet" id="qrSheet"></div>

  <script>
    const BASE_URL = "https://asaschachar.github.io/xtine-turns-30";
    const stops = ["toys","tble","ice","suv","biscuit","lh","bed","park"];

    const grid = document.getElementById('grid');
    const qrSheet = document.getElementById('qrSheet');

    stops.forEach((stop) => {
      const stopEl = document.createElement('div');
      stopEl.className = 'stop';
      stopEl.innerHTML = `
        <h3>${stop}</h3>
        <a href="${stop}/index.html">View card</a>
        <a href="${stop}/qrcode.html">View QR code</a>
      `;
      grid.appendChild(stopEl);

      const qrEl = document.createElement('div');
      qrEl.className = 'qr-card';
      const targetUrl = `${BASE_URL}/${stop}/`;
      qrEl.innerHTML = `
        <h4>${stop}</h4>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(targetUrl)}" alt="QR code for ${stop}">
      `;
      qrSheet.appendChild(qrEl);
    });
  </script>
</body>
</html>
