<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asa Soundboard — Fails</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100
      100%22><text y=%22.9em%22 font-size=%2290%22>😢</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Don't use this in production: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      button:active {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="container mx-auto p-3">
      <a href="../" class="inline-block bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm py-2 px-4 rounded">
        ← Back
      </a>
    </div>
    <div id="root"></div>
    <div id="alternates" class="text-gray-300 flex justify-center">
      <a href="http://night-pimp.com/soundboard/" class="px-2">Dae-Ho's</a> ·
      <a href="https://www.myinstants.com/" class="px-2">MyInstants</a>
    </div>
    <script type="text/babel">
      const SOUND_BOARD = {
        Fails: [
          {
            file: "https://www.myinstants.com/media/sounds/the-price-is-right-losing-horn.mp3",
            label: "📯 Price is Right",
          },
          {
            file: "https://www.myinstants.com/media/sounds/8d82b5_pacman_dies_sound_effect.mp3",
            label: "👾 Pac-Man",
          },
          {
            file: "https://www.myinstants.com/media/sounds/super-mario-death-sound-sound-effect.mp3",
            label: "🍄 Mario",
          },
          {
            file: "https://www.myinstants.com/media/sounds/erro.mp3",
            label: "💻 Windows XP",
          },
          {
            file: "https://www.myinstants.com/media/sounds/sadtrombone.swf.mp3",
            label: "🎺 Sad Trombone",
          },
          {
            local: true,
            file: "stop",
            label: "Stop",
          },
        ],
      };

      function StopButton() {
        function stopSounds() {
          Howler.stop()
        }

        return (
          <button className="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 w-full h-32 md:h-auto
          md:rounded" onClick={stopSounds}
          >
            Stop
          </button>
        )
      }

      function SoundButton(props) {
        const soundLocation = props.local ? `./sounds/${props.file}` :  props.file;
        const sound = new Howl({
          src: [soundLocation]
        });

        function playSound() {
          Howler.stop()
          sound.play();
        }

        return (
          <button key={props.file} className="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 w-full h-32 md:h-auto
          md:rounded" onClick={playSound}
          >
            {props.label}
          </button>
        )
      }

      function Category(props) {
        const buttonList = props.sounds.map((sound) => {
          if (sound.file === 'stop') {
            return <StopButton />
          } else {
            return <SoundButton file={sound.file} label={sound.label} local={sound.local} />
          }
        });
        return (
          <div className="container mx-auto p-3">
            <h1 className="text-3xl mb-8">{props.categoryName}</h1>
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
              { buttonList }
            </div>
          </div>
        )
      }

      function Soundboard() {
        return Object.keys(SOUND_BOARD).map((key) => (
          <Category categoryName={key} sounds={SOUND_BOARD[key]} />
        ));
      }

      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<Soundboard />);

    </script>
  </body>
</html>
